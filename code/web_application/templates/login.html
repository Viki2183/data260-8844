<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Open-Source Security Reports</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                Open-Source Security Reports
            </a>

            <a class="btn btn-outline-light" href="/">
                Home
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-6 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h1 class="h3 text-center mb-4">
                            User Login
                        </h1>

                        {% if error %}
                            <div
                                class="alert alert-danger"
                                role="alert"
                            >
                                {{ error }}
                            </div>
                        {% endif %}

                        <form method="post" action="/login">
                            <div class="mb-3">
                                <label
                                    for="username"
                                    class="form-label"
                                >
                                    Username
                                </label>

                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-control"
                                    required
                                    autofocus
                                >
                            </div>

                            <div class="mb-3">
                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Login
                            </button>
                        </form>

                        <div class="alert alert-secondary mt-4 mb-0">
                            <small>
                                Demo username: <strong>admin</strong><br>
                                Demo password: <strong>password</strong>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
