<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Open-Source Package Vulnerability Reports</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>Open-Source Package Vulnerability Reports</h1>

        <section aria-labelledby="search-heading">
            <h2 id="search-heading">Search Reports</h2>

            <form id="searchForm">
                <label for="searchInput">Search by package or vulnerability ID</label>

                <input
                    type="text"
                    id="searchInput"
                    name="search"
                    placeholder="Example: requests or CVE-2024-35195"
                >

                <button type="submit">Search Reports</button>
                <button
                    type="button"
                    id="clearSearchButton"
                    class="secondary-button"
                >
                    Show All Reports
                </button>
            </form>
        </section>

        <section aria-labelledby="reports-heading">
            <h2 id="reports-heading">Submitted Reports</h2>

            <p id="loadingState" class="loading-state">
                Loading vulnerability reports...
            </p>

            <p id="emptyState" class="empty-state hidden">
                No vulnerability reports were found.
            </p>

            <p id="errorState" class="error-state hidden"></p>

            <div id="reportsList"></div>
        </section>

        <form id="vulnerabilityForm">
            <h2 id="form-heading">Submit a Vulnerability Report</h2>

            <input type="hidden" id="reportId">

            <label for="packageName">Package Name</label>
            <input
                type="text"
                id="packageName"
                name="packageName"
                placeholder="Enter the affected package name"
                required
                autofocus
            >

            <label for="vulnerabilityId">Vulnerability ID</label>
            <input
                type="text"
                id="vulnerabilityId"
                name="vulnerabilityId"
                placeholder="Enter a CVE or security advisory identifier"
                required
            >

            <label for="submitterEmail">Submitter Email</label>
            <input
                type="email"
                id="submitterEmail"
                name="submitterEmail"
                placeholder="Enter your SJSU email address"
                required
            >

            <label for="vulnerabilityDescription">
                Vulnerability Description
            </label>

            <textarea
                id="vulnerabilityDescription"
                name="vulnerabilityDescription"
                placeholder="Describe the vulnerability and its potential impact"
                required
            ></textarea>

            <label for="severity">Severity Category</label>

            <select id="severity" name="severity" required>
                <option value="" disabled selected>Select severity</option>
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>

            <div class="terms">
                <input
                    type="checkbox"
                    id="termsAccepted"
                    name="termsAccepted"
                >

                <label for="termsAccepted">
                    I agree to the terms and conditions.
                </label>
            </div>

            <button type="submit" id="submitButton">
                Submit Vulnerability Report
            </button>

            <button
                type="button"
                id="cancelEditButton"
                class="secondary-button hidden"
            >
                Cancel Edit
            </button>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
