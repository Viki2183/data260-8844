name: data260-hw8

services:
  hw08-kafka:
    image: apache/kafka:3.9.2
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://hw08-kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@hw08-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 2
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  hw08-entity-worker:
    build:
      context: .
      dockerfile: code/Dockerfile.hw08
    command: python code/hw08_entity_worker.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: hw08-kafka:9092
    depends_on:
      hw08-kafka:
        condition: service_healthy

  hw08-api:
    build:
      context: .
      dockerfile: code/Dockerfile.hw08
    command: uvicorn code.hw08_api:app --host 0.0.0.0 --port 8744
    ports:
      - "8744:8744"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: hw08-kafka:9092
      PORT_BASE: "8744"
    depends_on:
      hw08-kafka:
        condition: service_healthy
      hw08-entity-worker:
        condition: service_started

  hw08-planner:
    build:
      context: .
      dockerfile: code/Dockerfile.hw08
    command: python code/hw08_planner.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: hw08-kafka:9092
    depends_on:
      - hw08-kafka

  hw08-writer-1:
    build:
      context: .
      dockerfile: code/Dockerfile.hw08
    command: python code/hw08_writer.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: hw08-kafka:9092
      HW8_CRASH_BEFORE_COMMIT_ONCE: "${HW8_WRITER_1_CRASH_BEFORE_COMMIT_ONCE:-0}"
      HW8_CRASH_MARKER: /tmp/hw08-writer-1-crash-used
      HW8_WRITER_NAME: writer-1
    depends_on:
      hw08-kafka:
        condition: service_healthy

  hw08-writer-2:
    build:
      context: .
      dockerfile: code/Dockerfile.hw08
    command: python code/hw08_writer.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: hw08-kafka:9092
      HW8_WRITER_NAME: writer-2
    depends_on:
      hw08-kafka:
        condition: service_healthy

  hw08-reviewer:
    build:
      context: .
      dockerfile: code/Dockerfile.hw08
    command: python code/hw08_reviewer.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: hw08-kafka:9092
    depends_on:
      - hw08-kafka

